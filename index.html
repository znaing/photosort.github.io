<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Photo Swipe Sorter</title>
  <style>
    /* General Styling */
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      color: white;
      background: linear-gradient(180deg, #7b2ff7, #f107a3);
      overflow-x: hidden;
      scroll-behavior: smooth;
    }

    header {
      padding: 100px 20px 40px;
      text-align: center;
      position: relative;
      z-index: 2;
      animation: fadeIn 1.2s ease-out forwards;
    }

    .app-icon {
      width: 130px;
      height: 130px;
      border-radius: 28px;
      object-fit: cover;
      box-shadow: 0 8px 30px rgba(0, 0, 0, 0.35);
      animation: fadeInUp 1.2s ease-out forwards;
    }

    h1 {
      font-size: 2.3em;
      margin-top: 24px;
      font-weight: 700;
      animation: fadeInUp 1.5s ease-out forwards;
    }

    .tagline {
      font-size: 1.1em;
      opacity: 0.9;
      margin: 20px auto 30px;
      max-width: 600px;
      padding: 0 20px;
      line-height: 1.5;
      animation: fadeIn 2s ease-out forwards;
    }

    /* App Store Button */
    .appstore-button {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      background-color: black;
      border-radius: 12px;
      padding: 10px 16px;
      text-decoration: none;
      color: white;
      font-weight: 500;
      font-size: 0.95em;
      transition: transform 0.2s ease, opacity 0.3s;
      animation: fadeInUp 2s ease-out forwards;
    }

    .appstore-button:hover {
      opacity: 0.9;
      transform: scale(1.03);
    }

    .apple-logo {
      width: 20px;
      height: 20px;
      fill: white;
    }

    /* Parallax background */
    .parallax {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: radial-gradient(circle at top left, #ff6ec7, #7b2ff7);
      z-index: 0;
      animation: gradientMove 15s ease infinite alternate;
    }

    /* Glass Screenshot Section */
    .screenshot-section {
      backdrop-filter: blur(18px) saturate(150%);
      -webkit-backdrop-filter: blur(18px) saturate(150%);
      background-color: rgba(255, 255, 255, 0.35);
      border-radius: 50px;
      margin: 80px 20px;
      padding: 60px;
      text-align: center;
      position: relative;
      z-index: 2;
      animation: fadeInUp 2s ease-out forwards;
    }

    .screenshot-section h2 {
      font-size: 1.8em;
      color: white;
      margin-bottom: 20px;
    }

    .screenshot-scroll {
      display: flex;
      overflow-x: auto;
      scroll-snap-type: x mandatory;
      gap: 20px;
      padding: 0 20px;
      justify-content: center;
    }

    .screenshot-scroll img {
      width: 320px;
      max-width: 90vw;
      border-radius: 20px;
      scroll-snap-align: center;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.25);
      opacity: 0;
      transition: all 1s ease;
    }

    .screenshot-scroll img.visible {
      opacity: 1;
      transform: translateY(0);
    }

    footer {
      text-align: center;
      padding: 40px 0;
      font-size: 0.95em;
      opacity: 0.9;
      color: white;
      animation: fadeIn 3s ease-out forwards;
    }

    footer a {
      color: #ffd6f9;
      text-decoration: none;
      font-weight: 500;
      transition: color 0.3s ease;
    }

    footer a:hover {
      color: #fff;
    }

    /* Animations */
    @keyframes fadeIn {
      0% { opacity: 0; }
      100% { opacity: 1; }
    }

    @keyframes fadeInUp {
      0% { opacity: 0; transform: translateY(30px); }
      100% { opacity: 1; transform: translateY(0); }
    }

    @keyframes gradientMove {
      0% { background-position: 0% 0%; }
      100% { background-position: 100% 100%; }
    }

    /* Responsive */
    @media (max-width: 768px) {
      h1 {
        font-size: 1.8em;
      }
      .app-icon {
        width: 110px;
        height: 110px;
      }
      .screenshot-section {
        padding: 30px 16px;
        margin: 40px 12px;
        border-radius: 28px;
      }
      .screenshot-scroll {
        gap: 12px;
        padding: 0 4px;
        justify-content: flex-start;
      }
      .screenshot-scroll img {
        width: min(260px, 75vw);
      }
    }

    .screenshot-scroll::-webkit-scrollbar {
      display: none;
    }
  </style>
</head>
<body>
  <div class="parallax"></div>

  <header>
    <img src="app-icon.png" alt="App Icon" class="app-icon" />
    <h1>Photo Swipe Sorter</h1>

    <a href="https://apps.apple.com/us/app/photos-swipe-sorter/id6753266914" class="appstore-button" target="_blank" rel="noopener noreferrer">
      <svg class="apple-logo" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 384 512"><path d="M318.7 268.7c-.3-37.1 16.4-65.2 50-85.7-18.8-27.3-46.9-42.5-84.7-45.5-35.5-2.9-74.4 20.7-88.6 20.7-15 0-49.3-19.8-76.3-19.8C66.2 139 0 184.3 0 289.4 0 325.3 14 362 42 399.4c19.4 27.3 44.8 57.9 77.5 57.2 30.6-.7 42.3-19.7 79.2-19.7 36.8 0 47.1 19.7 76.3 19.1 32.6-.6 53.2-27.8 72.5-55.3 22.7-32.8 32-64.5 31.2-65.5-0.8-.3-61.6-23.7-61.7-66.5zm-56.1-164.5c15.6-18.9 26.1-45.1 23.3-71.5-22.5.9-49.7 15-65.7 33.9-14.4 16.6-27 43-23.6 68.2 25.1 1.9 50.5-12.8 66-30.6z"/></svg>
      <span>Download on the App Store</span>
    </a>

    <p class="tagline">
      Reclaim your iPhone storage instantly. Swipe through photos like Tinder — right to keep, left to delete. Fast, fun, and surprisingly addictive.
    </p>
  </header>

  <section class="screenshot-section">
    <h2>App Screenshots</h2>
    <div class="screenshot-scroll">
      <img src="English1.jpeg" alt="Screenshot 1" />
      <img src="English2.jpeg" alt="Screenshot 2" />
      <img src="English3.jpeg" alt="Screenshot 3" />
      <img src="English4.jpeg" alt="Screenshot 4" />
    </div>
  </section>

  <footer>
    <p>© 2025 Photo Swipe Sorter · Designed with ❤️ by <a href="https://own.page/zaid" target="_blank" rel="noopener noreferrer">Zaid Naing</a></p>
    <p><a href="mailto:zaidnaing@gmail.com?subject=Photo%20Swipe%20Sorter%20Support">Contact Support</a></p>
  </footer>

  <script>
    // Fade in screenshots when visible
    const images = document.querySelectorAll('.screenshot-scroll img');
    const observer = new IntersectionObserver((entries) => {
      entries.forEach(entry => {
        if (entry.isIntersecting) {
          entry.target.classList.add('visible');
        }
      });
    }, { threshold: 0.2 });

    images.forEach(img => observer.observe(img));
  </script>
</body>
</html>
